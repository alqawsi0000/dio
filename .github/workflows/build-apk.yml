name: Build Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check files
        run: |
          echo "Files in repository:"
          ls -la
          echo "Checking ZIP files..."
          find . -maxdepth 3 -type f -name "*.zip"

      - name: Extract ZIP files
        run: |
          mkdir -p extracted

          ZIP_COUNT=$(find . -maxdepth 3 -type f -name "*.zip" | wc -l)

          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "ERROR: No ZIP files found"
            exit 1
          fi

          find . -maxdepth 3 -type f -name "*.zip" -print0 | while IFS= read -r -d '' archive; do
            echo "Extracting: $archive"
            unzip -oq "$archive" -d extracted
          done

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" -type f -name "pubspec.yaml" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter pubspec.yaml not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build APK
        run: flutter build apk --release
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dio-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
